name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Inertia's SSR renderer runs beside the web under a supervisor in the
      # app's PHP (pcntl): tested with the renderer on the runner's Node, on
      # Bun, and compiled by bun build --compile
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pcntl
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # the release builds what a tag would, so a broken config fails here,
      # not at the tag
      - name: the release builds (GoReleaser snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
