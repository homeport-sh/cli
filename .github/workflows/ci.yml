name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Inertia's SSR renderer runs beside the web under a supervisor in the
      # app's PHP (pcntl): tested with the renderer on the runner's Node, on
      # Bun, and compiled by bun build --compile
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pcntl
          coverage: none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # the release builds what a tag would, so a broken config fails here,
      # not at the tag
      - name: the release builds (GoReleaser snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

  # the JavaScript examples, built as a hosted build builds them - the plan's
  # own install and command in its image, GNU find and tar - and run from
  # what the build made, alone, in a bare Debian: TanStack Start's Nitro
  # output on Node and on Bun, adapter-bun's binary and bundle
  examples:
    runs-on: ubuntu-latest
    env:
      # the examples branch with these apps; main once examples#6 is merged
      EXAMPLES_REF: tanstack-start-and-sveltekit-bun
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/checkout@v7
        with:
          repository: homeport-sh/examples
          ref: ${{ env.EXAMPLES_REF }}
          path: examples

      - name: build homeport
        run: go build -o "$RUNNER_TEMP/homeport" ./cmd/homeport

      - name: build and run the examples
        run: e2e/js-examples.sh "$RUNNER_TEMP/homeport" examples
